name: ${COMPOSE_PROJECT_NAME:-privacy-stack}

##############################################################################
# 🔒 The Complete Privacy Stack
# One command. A focused self-hosted stack. Full data ownership.
#
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. Run: docker compose up -d
#   3. Connect through Tailscale
#   4. Open Homepage at http://YOUR_TAILSCALE_IP:3002
#
# Apps included:
#   - Paperless-ngx (document management)
#   - Jellyfin (Netflix replacement)
#   - AdGuard Home (DNS + ad blocking)
#   - Uptime Kuma (monitoring)
#   - Homepage (dashboard)
#   - Tailscale (secure remote access)
#
# Requirements:
#   - Ubuntu 22.04/24.04 LTS
#   - Docker + Docker Compose v2
#   - Minimum 4GB RAM, 8GB recommended
#   - 40GB+ disk (more for media)
##############################################################################

services:

  # ============================================================
  # NGINX PROXY MANAGER — Reverse proxy + free SSL certificates
  # Access: http://YOUR_IP:81 (admin panel)
  # Default login: admin@example.com / changeme
  # ============================================================
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest@sha256:52b2c59994f3d36acfcf70a1626f29734df0ed8c71bacc0269f78b6f939858bb
    container_name: npm
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  # ============================================================
  # PAPERLESS-NGX — Document management + OCR
  # Access via NPM: docs.yourdomain.com → localhost:8000
  # ============================================================
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:17312f00bac06f8dad09d67c6c8c069fc5c076c0c22313241c673102dfaf8ee9
    container_name: paperless
    restart: unless-stopped
    profiles: ["docs"]
    ports:
      - "8000:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - ${PAPERLESS_CONSUME_DIR:-./data/paperless/consume}:/usr/src/paperless/consume
      - ${PAPERLESS_EXPORT_DIR:-./data/paperless/export}:/usr/src/paperless/export
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBUSER=${PAPERLESS_DB_USER:-postgres}
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless-gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://paperless-tika:9998
      - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USER:-admin}
      - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_URL=${PAPERLESS_URL:-http://localhost:8000}
    depends_on:
      - paperless-db
      - paperless-redis
      - paperless-gotenberg
      - paperless-tika
    networks:
      - proxy
      - paperless

  paperless-db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: paperless_db
    restart: unless-stopped
    profiles: ["docs"]
    environment:
      - POSTGRES_PASSWORD=${PAPERLESS_DB_PASSWORD}
      - POSTGRES_DB=paperless
    volumes:
      - paperless_pgdata:/var/lib/postgresql/data
    networks:
      - paperless

  paperless-redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: paperless_redis
    restart: unless-stopped
    profiles: ["docs"]
    networks:
      - paperless

  paperless-gotenberg:
    image: gotenberg/gotenberg:8@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
    container_name: paperless_gotenberg
    restart: unless-stopped
    profiles: ["docs"]
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    networks:
      - paperless

  paperless-tika:
    image: apache/tika:latest@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    container_name: paperless_tika
    restart: unless-stopped
    profiles: ["docs"]
    networks:
      - paperless

  # ============================================================
  # JELLYFIN — Media server (Netflix replacement)
  # Access via NPM: media.yourdomain.com → localhost:8096
  # ============================================================
  jellyfin:
    image: jellyfin/jellyfin:latest@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    restart: unless-stopped
    profiles: ["media"]
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${MEDIA_DIR:-./data/media}:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL:-http://localhost:8096}
    networks:
      - proxy

  # ============================================================
  # ADGUARD HOME — DNS server + ad/tracker blocking
  # First-run wizard: host port 3000; permanent dashboard: host port 3003
  # DNS: point devices to YOUR_SERVER_IP as DNS server
  # ============================================================
  adguard:
    image: adguard/adguardhome:latest@sha256:1ea34eafe5dc691007946e8eaab7bf46b0de9412f39213d8c06e48b53bf9a6c5
    container_name: adguard
    restart: unless-stopped
    profiles: ["dns"]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000"
      - "3003:80"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    networks:
      - proxy

  # ============================================================
  # VAULTWARDEN — Bitwarden-compatible password manager
  # Access via NPM: vault.yourdomain.com → localhost:8080
  # ============================================================
  vaultwarden:
    image: vaultwarden/server:latest@sha256:e6443e3d5ed8fcee2204b89ec778d7f24d0173bcc42d1ea34f990304f5f63f51
    container_name: vaultwarden
    restart: unless-stopped
    profiles: ["passwords"]
    ports:
      - "8080:80"
    volumes:
      - vaultwarden_data:/data
    environment:
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - DOMAIN=${VAULTWARDEN_URL:-https://vault.yourdomain.com}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS:-false}
    networks:
      - proxy

  # ============================================================
  # UPTIME KUMA — Service monitoring
  # Access via NPM: status.yourdomain.com → localhost:3001
  # ============================================================
  uptime-kuma:
    image: louislam/uptime-kuma:latest@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    container_name: uptime_kuma
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - proxy

  # ============================================================
  # TAILSCALE — Secure remote access (no port forwarding needed)
  # After starting, run: docker exec tailscale tailscale up
  # Then access all services from anywhere via Tailscale IP
  # ============================================================
  tailscale:
    image: tailscale/tailscale:latest@sha256:f15d5d3f4a68773a853180b72496f70ba614b64de0878c43fe3da39fe0afba47
    container_name: tailscale
    restart: unless-stopped
    profiles: ["vpn"]
    hostname: privacy-stack
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_DEBUG_FIREWALL_MODE=auto
    network_mode: host

  # ============================================================
  # HOMEPAGE — Dashboard linking all your services
  # Access via NPM: home.yourdomain.com → localhost:3002
  # ============================================================
  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
    container_name: homepage
    restart: unless-stopped
    profiles: ["dashboard"]
    ports:
      - "3002:3000"
    volumes:
      - ./configs/homepage:/app/config
    networks:
      - proxy

# ============================================================
# VOLUMES
# ============================================================
volumes:
  npm_data:
  npm_letsencrypt:
  paperless_data:
  paperless_media:
  paperless_pgdata:
  jellyfin_config:
  jellyfin_cache:
  adguard_work:
  adguard_conf:
  vaultwarden_data:
  uptime_kuma_data:
  tailscale_data:

# ============================================================
# NETWORKS
# ============================================================
networks:
  proxy:
    name: privacy-stack
  paperless:
    internal: true
