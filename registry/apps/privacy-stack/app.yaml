apiVersion: install.run/v1
kind: Application
metadata:
  id: privacy-stack
  name: Complete Privacy Stack
  description: A focused self-hosted stack with automatic setup, credentials, backups, and health checks.
release:
  version: 0.1.0
deployment:
  compose: docker-compose.yml
  primaryService: homepage
  setupScript: scripts/setup.sh
  ingress:
    service: homepage
    port: 3000
configuration:
  - key: domain
    type: hostname
    required: false
    env: DOMAIN
  - key: profiles
    type: string
    required: false
    default: docs,media,dns,monitoring,dashboard,vpn
    env: COMPOSE_PROFILES
presets:
  aws-credit:
    description: Full product validation on an 8 GB AWS credit-eligible instance.
    minimumRAMMB: 7000
    values:
      profiles: docs,media,dns,monitoring,dashboard,vpn
